name: Build English and Japanese pages

# index.html(한국어)이나 번역 파일이 바뀌면 en/index.html, ja/index.html 을 다시 만들어 커밋합니다.
# 번역이 빠진 한국어 문장이 있으면 목록을 보여주고 실패합니다(영어·일본어 페이지는 그대로 유지).
on:
  push:
    branches: [main]
    paths: [index.html, i18n/**, tools/build_i18n.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-i18n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/build_i18n.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add en ja
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Rebuild English and Japanese pages"
          git pull --rebase origin main
          git push
